name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Financial Aggregates & Storage Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Dependencies
        run: pip install fastapi pydantic pytest httpx python-dotenv
      - name: Run Pytest Suite
        run: pytest -v test_aggregates.py test_storage.py
